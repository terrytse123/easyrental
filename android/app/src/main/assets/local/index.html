<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>香港租租</title>
  <style>
    :root { color-scheme: light; --paper:#f4efe6; --ink:#1c2430; --muted:#6d6458; --brass:#8c6a3d; --card:#fffdf8; --line:#e4d9c8; --clay:#9c3b2e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 16px/1.45 sans-serif; }
    header, main { padding: 16px 16px 0; }
    main { flex: 1; }
    h1 { margin: 0; font-size: 32px; font-weight: 560; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; }
    .card, .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .stat b { display: block; font-size: 20px; }
    .stat span, label { color: var(--muted); font-size: 13px; }
    button, .ghost { min-height: 44px; border-radius: 999px; border: 0; padding: 0 16px; font-weight: 650; }
    button.primary, button { background: var(--ink); color: var(--paper); }
    button.ghost, .ghost { background: transparent; color: var(--brass); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--clay); }
    form { display: grid; gap: 8px; margin: 12px 0 18px; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); padding: 8px 12px; font: inherit; }
    textarea { min-height: 72px; }
    .item { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 8px; }
    .item p { margin: 2px 0; }
    .over { color: var(--clay); }
    .ok { color: #2f6b45; }
    nav { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--card); border-top: 1px solid var(--line); }
    nav button { border-radius: 0; background: transparent; color: var(--muted); min-height: 58px; font-size: 12px; }
    nav button.on { color: var(--brass); }
    .hide { display: none; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  </style>
</head>
<body>
  <header>
    <h1>香港租租</h1>
    <p class="sub">本地帳簿 · 只存在這部手機 · 不用上網</p>
  </header>
  <main id="app"></main>
  <nav>
    <button type="button" data-tab="home">總覽</button>
    <button type="button" data-tab="homes">物業</button>
    <button type="button" data-tab="leases">租約</button>
    <button type="button" data-tab="pay">收款</button>
    <button type="button" data-tab="net">收益</button>
    <button type="button" data-tab="fix">維修</button>
  </nav>
  <script>
    const KEY = "easyrental-local-ledger";
    const DISTRICTS = ["中西區","灣仔","東區","南區","油尖旺","深水埗","九龍城","黃大仙","觀塘","荃灣","屯門","元朗","北區","大埔","沙田","西貢","葵青","離島"];
    const METHODS = [["fps","轉數快"],["bank","銀行轉帳"],["payme","PayMe"],["cash","現金"],["cheque","支票"]];
    const empty = () => ({ properties: [], tenants: [], tenancies: [], payments: [], tickets: [] });
    let db = empty();
    let tab = "home";
    let editLeaseId = "";
    let payProperty = "";

    function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 10); }
    function monthKey(d = new Date()) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function today() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function hkd(n) { return "HK$" + Math.round(Number(n) || 0).toLocaleString("zh-HK"); }
    function daysUntil(iso) {
      const a = new Date(today() + "T00:00:00");
      const b = new Date(iso + "T00:00:00");
      return Math.round((b.getTime() - a.getTime()) / 86400000);
    }
    function selfWa(text) {
      return "https://wa.me/?text=" + encodeURIComponent(text);
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "\u0026amp;")
        .replace(/</g, "\u0026lt;")
        .replace(/>/g, "\u0026gt;")
        .replace(/"/g, "\u0026quot;");
    }
    function byId(list, id) { return list.find((x) => x.id === id); }

    function storeGet() {
      try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; }
    }
    function storeSet(json) {
      try { localStorage.setItem(KEY, json); } catch (e) { /* file pages often block this */ }
    }
    function persist() {
      const json = JSON.stringify(db);
      storeSet(json);
      try { if (window.Android && Android.saveLedger) Android.saveLedger(json); } catch (e) {}
    }
    function asList(value) { return Array.isArray(value) ? value : []; }
    function normalize(parsed) {
      const base = empty();
      if (!parsed || typeof parsed !== "object") return base;
      base.properties = asList(parsed.properties);
      base.tenants = asList(parsed.tenants);
      base.tenancies = asList(parsed.tenancies);
      base.payments = asList(parsed.payments);
      base.tickets = asList(parsed.tickets);
      return base;
    }
    function load() {
      let json = "";
      try { if (window.Android && Android.loadLedger) json = Android.loadLedger() || ""; } catch (e) {}
      if (!json) json = storeGet();
      try { db = normalize(json ? JSON.parse(json) : null); }
      catch (e) { db = empty(); }
    }

    function ensureCharge(tenancy) {
      const period = monthKey();
      if (db.payments.some((p) => p.tenancyId === tenancy.id && p.period === period)) return;
      const due = period + "-" + String(tenancy.dueDay || 1).padStart(2, "0");
      db.payments.unshift({ id: uid("pay"), tenancyId: tenancy.id, period, amount: tenancy.rent, paidAmount: 0, dueDate: due });
    }

    function render() {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
      const app = document.getElementById("app");
      app.innerHTML = views[tab]();
      app.querySelectorAll("[data-action]").forEach((el) => el.addEventListener("click", onAction));
      app.querySelectorAll("form").forEach((form) => form.addEventListener("submit", onSubmit));
      try { fillPapers(); } catch (e) { /* photos are optional */ }
    }

    const views = {
      home() {
        const period = monthKey();
        const due = db.payments.filter((p) => p.period === period);
        const billed = due.reduce((s, p) => s + p.amount, 0);
        const got = due.reduce((s, p) => s + Math.min(p.paidAmount, p.amount), 0);
        const rows = db.payments.filter((p) => p.paidAmount < p.amount).slice(0, 8).map((p) => {
          const lease = byId(db.tenancies, p.tenancyId);
          const home = lease && byId(db.properties, lease.propertyId);
          const who = lease && byId(db.tenants, lease.tenantId);
          const late = p.dueDate < today();
          return `<div class="item card"><div><p>${esc(home ? home.name : "單位")}</p><p class="${late ? "over" : ""}">${esc(who ? who.name : "")} · 到期 ${esc(p.dueDate)}</p></div><b>${hkd(p.amount - p.paidAmount)}</b></div>`;
        }).join("") || `<p class="sub">未有待收租金。</p>`;
        const renewals = db.tenancies.filter((t) => t.active && daysUntil(t.end) <= 90).sort((a, b) => a.end.localeCompare(b.end));
        const renewHtml = renewals.map((t) => {
          const home = byId(db.properties, t.propertyId);
          const who = byId(db.tenants, t.tenantId);
          const days = daysUntil(t.end);
          const text = days < 0
            ? "提醒：" + (home ? home.name : "單位") + "（" + (who ? who.name : "租客") + "）的租約已於 " + t.end + " 結束。請盡快同租客確認續約或退租。"
            : "提醒：" + (home ? home.name : "單位") + "（" + (who ? who.name : "租客") + "）的租約將於 " + t.end + " 到期，還有 " + days + " 日。現在應聯絡租客談續約。";
          return `<div class="card"><p>${esc(home ? home.name : "單位")} · ${esc(who ? who.name : "")}</p><p class="${days < 0 ? "over" : "sub"}">${esc(text)}</p><a class="ghost" style="display:inline-flex;align-items:center;margin-top:8px" href="${esc(selfWa(text))}">傳到我的 WhatsApp</a></div>`;
        }).join("") || `<p class="sub">未來三個月沒有租約到期。</p>`;
        return `<div class="stats"><div class="stat"><span>本月應收</span><b>${hkd(billed)}</b></div><div class="stat"><span>已收</span><b>${hkd(got)}</b></div><div class="stat"><span>未收</span><b>${hkd(billed - got)}</b></div><div class="stat"><span>租約</span><b>${db.tenancies.filter((t) => t.active).length}</b></div></div><h2 style="margin:8px 0">續約提醒</h2>${renewHtml}${rows}<div class="tools"><button type="button" class="ghost" data-action="online">改用網上戶口</button><button type="button" class="ghost" data-action="export">匯出存檔</button><label class="ghost" style="display:inline-flex;align-items:center">匯入存檔<input id="import-file" type="file" accept="application/json,.json" hidden></label></div>`;
      },
      homes() {
        const list = db.properties.map((p) => `<div class="item card"><div><p>${esc(p.name)}</p><p class="sub">${esc(p.district)} · ${esc(p.sqft || 0)} 平方呎</p></div><button type="button" class="danger" data-action="del-home" data-id="${p.id}">刪除</button></div>`).join("") || `<p class="sub">尚未有物業。</p>`;
        return `<form data-kind="home"><label>屋苑或單位<input name="name" required></label><label>地區<select name="district">${DISTRICTS.map((d) => `<option>${d}</option>`).join("")}</select></label><label>地址<input name="address"></label><label>實用面積（平方呎）<input name="sqft" inputmode="numeric"></label><button class="primary" type="submit">新增物業</button></form>${list}`;
      },
      leases() {
        if (!db.properties.length) return `<p>請先新增物業。</p>`;
        const editing = byId(db.tenancies, editLeaseId);
        const who = editing && byId(db.tenants, editing.tenantId);
        const opts = db.properties.map((p) => `<option value="${p.id}"${editing && editing.propertyId === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("");
        const list = db.tenancies.map((t) => {
          const home = byId(db.properties, t.propertyId);
          const person = byId(db.tenants, t.tenantId);
          return `<div class="card"><div class="item"><div><p>${esc(person ? person.name : "租客")} · ${hkd(t.rent)}</p><p class="sub">${esc(home ? home.name : "")} · ${esc(t.start)} 至 ${esc(t.end)}</p></div><div><button type="button" class="ghost" data-action="edit-lease" data-id="${t.id}">修改</button><button type="button" class="danger" data-action="del-lease" data-id="${t.id}">結束</button></div></div><div data-papers="${t.id}"></div></div>`;
        }).join("") || `<p class="sub">尚未有租約。</p>`;
        return `<form data-kind="lease"><label>物業<select name="propertyId">${opts}</select></label><label>租客姓名<input name="tenant" required value="${esc(who ? who.name : "")}"></label><label>電話<input name="phone" value="${esc(who ? who.phone : "")}"></label><label>月租（HK$）<input name="rent" inputmode="numeric" required value="${editing ? editing.rent : ""}"></label><label>開始<input name="start" type="date" required value="${editing ? editing.start : ""}"></label><label>結束<input name="end" type="date" required value="${editing ? editing.end : ""}"></label><label>每月交租日<input name="dueDay" inputmode="numeric" value="${editing ? editing.dueDay : 1}"></label><button class="primary" type="submit">${editing ? "儲存修改" : "新增租約"}</button>${editing ? `<button type="button" class="ghost" data-action="cancel-lease">取消</button>` : ""}</form>${list}`;
      },
      pay() {
        const opts = db.tenancies.map((t) => {
          const home = byId(db.properties, t.propertyId);
          const who = byId(db.tenants, t.tenantId);
          return `<option value="${t.id}">${esc(home ? home.name : "單位")} · ${esc(who ? who.name : "")}</option>`;
        }).join("");
        const homes = db.properties.map((p) => `<option value="${p.id}"${payProperty === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("");
        const list = db.payments.filter((p) => {
          if (!payProperty) return true;
          const lease = byId(db.tenancies, p.tenancyId);
          return lease && lease.propertyId === payProperty;
        }).map((p) => {
          const lease = byId(db.tenancies, p.tenancyId);
          const home = lease && byId(db.properties, lease.propertyId);
          const who = lease && byId(db.tenants, lease.tenantId);
          const paid = p.paidAmount >= p.amount;
          return `<div class="card item"><div><p>${esc(home ? home.name : "")} · ${esc(p.period)}</p><p class="${paid ? "ok" : "over"}">${esc(who ? who.name : "")} · ${paid ? "已收 " + esc(p.paidDate || "") : "未收"} ${hkd(p.amount)}</p></div>${paid ? "" : `<button type="button" data-action="paid" data-id="${p.id}">記一筆已收</button>`}</div>`;
        }).join("") || `<p class="sub">未有收款。</p>`;
        const add = db.tenancies.length
          ? `<form data-kind="newpay"><label>租約<select name="tenancyId">${opts}</select></label><label>金額（HK$）<input name="amount" inputmode="numeric" required></label><label>付款月份<input name="period" type="month" required value="${monthKey()}"></label><label>收款日期<input name="paidDate" type="date" required value="${today()}"></label><label>方式<select name="method">${METHODS.map(([v, label]) => `<option value="${v}">${label}</option>`).join("")}</select></label><label>參考編號<input name="ref"></label><button class="primary" type="submit">新增收款</button></form>`
          : `<p>請先新增租約。</p>`;
        return `${add}<label>物業<select data-pay-property><option value="">全部物業</option>${homes}</select></label><button type="button" class="ghost" data-action="charges">生成本月未開的租金</button>${list}<form id="pay-form" class="hide" data-kind="paid"><input type="hidden" name="id"><label>收款日期<input name="paidDate" type="date" required value="${today()}"></label><label>方式<select name="method">${METHODS.map(([v, label]) => `<option value="${v}">${label}</option>`).join("")}</select></label><label>參考編號<input name="ref"></label><button class="primary" type="submit">儲存</button></form>`;
      },
      net() {
        const rows = new Map();
        const touch = (year, propertyId) => {
          const key = year + "|" + propertyId;
          if (!rows.has(key)) rows.set(key, { year, propertyId, rent: 0, repairs: 0 });
          return rows.get(key);
        };
        db.payments.forEach((p) => {
          const lease = byId(db.tenancies, p.tenancyId);
          const year = String(p.period || "").slice(0, 4);
          if (!lease || !/^\d{4}$/.test(year) || !(p.paidAmount > 0)) return;
          touch(year, lease.propertyId).rent += p.paidAmount;
        });
        db.tickets.forEach((t) => {
          const year = String(t.created || "").slice(0, 4);
          if (!/^\d{4}$/.test(year) || !t.cost) return;
          touch(year, t.propertyId).repairs += Number(t.cost) || 0;
        });
        const lines = Array.from(rows.values()).map((row) => {
          const home = byId(db.properties, row.propertyId);
          const holding = ((home && home.managementFee) || 0) + ((home && home.rates) || 0);
          return { ...row, name: home ? home.name : "單位", holding: holding * 12, net: row.rent - row.repairs - holding * 12 };
        }).sort((a, b) => b.year.localeCompare(a.year) || a.name.localeCompare(b.name, "zh-HK"));
        if (!lines.length) return `<p class="sub">未有已收租金或維修，暫時未能計算。已收租金按付款月份計入該年，再減維修。</p>`;
        let html = `<p class="sub">已收租金按付款月份計入該年，再減維修。管理費及差餉用每月金額乘 12。按金不算收入。</p>`;
        let year = "";
        lines.forEach((line) => {
          if (line.year !== year) {
            year = line.year;
            const total = lines.filter((item) => item.year === year).reduce((sum, item) => sum + item.net, 0);
            html += `<h2 style="margin:12px 0 4px">${esc(year)} · 合計 ${hkd(total)}</h2>`;
          }
          html += `<div class="card"><div class="item"><p>${esc(line.name)}</p><b class="${line.net < 0 ? "over" : ""}">${hkd(line.net)}</b></div><p class="sub">已收 ${hkd(line.rent)} · 維修 ${hkd(line.repairs)} · 管理費及差餉 ${hkd(line.holding)}</p></div>`;
        });
        return html;
      },
      fix() {
        if (!db.properties.length) return `<p>請先新增物業。</p>`;
        const opts = db.properties.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
        const list = db.tickets.map((t) => `<div class="item card"><div><p>${esc(t.title)}</p><p class="sub">${esc((byId(db.properties, t.propertyId) || {}).name || "")} · ${t.status === "done" ? "完成" : "未完成"} · ${hkd(t.cost || 0)}</p></div><button type="button" data-action="ticket" data-id="${t.id}">${t.status === "done" ? "重開" : "完成"}</button></div>`).join("") || `<p class="sub">未有維修。</p>`;
        return `<form data-kind="fix"><label>物業<select name="propertyId">${opts}</select></label><label>事項<input name="title" required></label><label>費用（HK$）<input name="cost" inputmode="numeric"></label><button class="primary" type="submit">新增維修</button></form>${list}`;
      }
    };

    function onSubmit(event) {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.currentTarget).entries());
      const kind = event.currentTarget.dataset.kind;
      if (kind === "home") {
        db.properties.unshift({ id: uid("p"), name: data.name.trim(), address: data.address.trim(), district: data.district, type: "private", beds: 0, baths: 0, sqft: Number(data.sqft) || 0, rent: 0, managementFee: 0, rates: 0, notes: "" });
      }
      if (kind === "lease") {
        const rent = Number(data.rent) || 0;
        const dueDay = Math.min(28, Math.max(1, Number(data.dueDay) || 1));
        const existing = editLeaseId ? byId(db.tenancies, editLeaseId) : null;
        if (existing) {
          const tenant = byId(db.tenants, existing.tenantId);
          if (tenant) { tenant.name = data.tenant.trim(); tenant.phone = data.phone.trim(); }
          existing.propertyId = data.propertyId;
          existing.start = data.start;
          existing.end = data.end;
          existing.rent = rent;
          existing.deposit = rent * 2;
          existing.dueDay = dueDay;
          db.payments.forEach((p) => {
            if (p.tenancyId !== existing.id || p.paidAmount > 0) return;
            p.amount = rent;
            p.dueDate = p.period + "-" + String(dueDay).padStart(2, "0");
          });
          editLeaseId = "";
        } else {
          const tenantId = uid("t");
          db.tenants.unshift({ id: tenantId, name: data.tenant.trim(), phone: data.phone.trim(), email: "", notes: "" });
          const tenancy = { id: uid("tn"), propertyId: data.propertyId, tenantId, start: data.start, end: data.end, rent, deposit: rent * 2, dueDay, stamped: false, active: true };
          db.tenancies.unshift(tenancy);
          ensureCharge(tenancy);
        }
      }
      if (kind === "newpay") {
        const lease = byId(db.tenancies, data.tenancyId);
        const period = String(data.period || "").slice(0, 7);
        const amount = Number(data.amount) || 0;
        if (lease && /^\d{4}-\d{2}$/.test(period)) {
          const dueDay = Math.min(28, Math.max(1, Number(lease.dueDay) || 1));
          db.payments.unshift({
            id: uid("pay"),
            tenancyId: lease.id,
            period,
            amount,
            paidAmount: amount,
            dueDate: period + "-" + String(dueDay).padStart(2, "0"),
            paidDate: data.paidDate,
            method: data.method,
            ref: String(data.ref || "").trim(),
          });
        }
      }
      if (kind === "paid") {
        const payment = byId(db.payments, data.id);
        if (payment) { payment.paidAmount = payment.amount; payment.paidDate = data.paidDate || today(); payment.method = data.method; payment.ref = String(data.ref || "").trim(); }
      }
      if (kind === "fix") {
        db.tickets.unshift({ id: uid("tk"), propertyId: data.propertyId, title: data.title.trim(), detail: "", status: "open", priority: "med", created: today(), cost: Number(data.cost) || 0 });
      }
      persist();
      render();
    }

    function onAction(event) {
      const el = event.currentTarget;
      const id = el.dataset.id;
      if (el.dataset.action === "del-home" && confirm("刪除這個物業和相關租約？")) {
        const leaseIds = new Set(db.tenancies.filter((t) => t.propertyId === id).map((t) => t.id));
        db.properties = db.properties.filter((p) => p.id !== id);
        db.tenancies = db.tenancies.filter((t) => t.propertyId !== id);
        db.payments = db.payments.filter((p) => !leaseIds.has(p.tenancyId));
        db.tickets = db.tickets.filter((t) => t.propertyId !== id);
        persist();
      }
      if (el.dataset.action === "edit-lease") {
        editLeaseId = id;
        tab = "leases";
        render();
        return;
      }
      if (el.dataset.action === "cancel-lease") {
        editLeaseId = "";
        render();
        return;
      }
      if (el.dataset.action === "del-lease" && confirm("結束這份租約？")) {
        if (editLeaseId === id) editLeaseId = "";
        db.tenancies = db.tenancies.filter((t) => t.id !== id);
        db.payments = db.payments.filter((p) => p.tenancyId !== id);
        persist();
      }
      if (el.dataset.action === "paid") {
        const form = document.getElementById("pay-form");
        form.classList.remove("hide");
        form.elements.id.value = id;
        form.scrollIntoView({ behavior: "smooth" });
        return;
      }
      if (el.dataset.action === "charges") {
        db.tenancies.filter((t) => t.active).forEach(ensureCharge);
        persist();
      }
      if (el.dataset.action === "ticket") {
        const ticket = byId(db.tickets, id);
        if (ticket) ticket.status = ticket.status === "done" ? "open" : "done";
        persist();
      }
      if (el.dataset.action === "online" && window.Android) Android.openOnline();
      if (el.dataset.action === "export") {
        const json = JSON.stringify(db, null, 2);
        if (window.Android && Android.shareLedger) Android.shareLedger(json);
        else {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
          a.download = "easyrental-ledger.json";
          a.click();
        }
        return;
      }
      render();
    }

    function compressFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("read"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("image"));
          img.onload = () => {
            const max = 1400;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            let quality = 0.72;
            let data = canvas.toDataURL("image/jpeg", quality);
            while (data.length > 420000 && quality > 0.4) {
              quality -= 0.12;
              data = canvas.toDataURL("image/jpeg", quality);
            }
            resolve(data);
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }
    function paperControls(id, kind, title) {
      return `<p style="margin:8px 0 4px">${title}</p><label class="ghost" style="display:inline-flex;align-items:center;margin-right:8px">拍照<input type="file" accept="image/*" capture="environment" hidden data-file="1" data-kind="${kind}" data-id="${id}"></label><label class="ghost" style="display:inline-flex;align-items:center">相簿<input type="file" accept="image/*" multiple hidden data-file="1" data-kind="${kind}" data-id="${id}"></label><div data-row="${id}-${kind}"></div>`;
    }
    function fillPapers() {
      document.querySelectorAll("[data-papers]").forEach((box) => {
        const id = box.getAttribute("data-papers");
        let rows = [];
        try {
          if (window.Android && Android.listPhotos) rows = JSON.parse(Android.listPhotos(id) || "[]");
        } catch (e) { rows = []; }
        box.innerHTML = `<p class="sub">續約可以再上傳，舊相片會保留。</p>${paperControls(id, "lease", "租約文件")}${paperControls(id, "stamp", "釐印")}`;
        rows.forEach((row) => {
          const src = window.Android && Android.loadPhoto ? Android.loadPhoto(row.id) : "";
          const slot = box.querySelector(`[data-row="${id}-${row.kind}"]`);
          if (!slot || !src) return;
          const wrap = document.createElement("div");
          wrap.style.cssText = "display:inline-block;margin:8px 8px 0 0";
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          img.style.cssText = "width:96px;height:96px;object-fit:cover;border-radius:12px";
          const del = document.createElement("button");
          del.type = "button";
          del.className = "danger";
          del.textContent = "刪除";
          del.dataset.action = "del-photo";
          del.dataset.id = row.id;
          wrap.append(img, del);
          slot.append(wrap);
        });
      });
    }

    document.getElementById("app").addEventListener("click", (event) => {
      const button = event.target.closest ? event.target.closest("[data-action='del-photo']") : null;
      if (!button || !window.Android || !Android.deletePhoto) return;
      Android.deletePhoto(button.dataset.id);
      fillPapers();
    });
    document.getElementById("app").addEventListener("change", (event) => {
      if (event.target.dataset && event.target.dataset.payProperty !== undefined) {
        payProperty = event.target.value;
        render();
        return;
      }
      if (event.target.dataset && event.target.dataset.file) {
        const input = event.target;
        const files = Array.from(input.files || []);
        input.value = "";
        void (async () => {
          for (const file of files) {
            const data = await compressFile(file);
            if (window.Android && Android.savePhoto) Android.savePhoto(uid("ph"), input.dataset.id, input.dataset.kind, data);
          }
          fillPapers();
        })().catch(() => alert("相片未能儲存。"));
        return;
      }
      if (event.target.id !== "import-file" || !event.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!Array.isArray(parsed.properties)) throw new Error("bad");
          db = { ...empty(), ...parsed };
          persist();
          render();
        } catch (e) { alert("這個檔案不是香港租租的帳簿。"); }
      };
      reader.readAsText(event.target.files[0]);
    });
    document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
    try { load(); render(); }
    catch (e) {
      document.getElementById("app").innerHTML = "<p>本地帳簿未能開啟。請再安裝一次新版本。</p>";
    }
  </script>
</body>
</html>
